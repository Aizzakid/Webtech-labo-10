<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="normalize.css">
    <title>form</title>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <img src="image.avif" alt="Stuur ons een bericht">

        <form method="get">
            <label for="naam">Naam:</label>
            <input
                type="text"
                id="naam"
                name="naam"
                placeholder="John Doe">

            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="johndoe@ap.be">

            <label for="bericht">Bericht:</label>
            <textarea
                id="bericht"
                name="bericht">Laat hier je bericht achter.</textarea>

            <button type="submit">Verzenden</button>
        </form>
    </main>

    <footer>
        Footer - AP Hogeschool
    </footer>

</body>
</html>
